[project]
name = "ctxd"
version = "0.1.14"
description = "Local context CLI, folder tracker, ctxfs service, and Python SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.11.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
ctxd = "ctxd.cli:main"
ctxd-mcp = "ctxd.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/ctxd", "src/ctxfs"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/ctxd", "src/ctxfs", "README.md"]

[tool.bumpversion]
current_version = "0.1.14"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
allow_dirty = true
