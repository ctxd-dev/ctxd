name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect public documentation changes
        if: github.event_name == 'pull_request'
        id: public_docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- docs/public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create docs-validation installation token
        if: steps.public_docs.outputs.changed == 'true'
        id: docs-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CTXD_DOCS_APP_ID }}
          private-key: ${{ secrets.CTXD_DOCS_APP_PRIVATE_KEY }}
          owner: ctxd-dev
          repositories: ctxd-landing

      - name: Validate public docs against ctxd-landing
        if: steps.public_docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          CTXD_COMMIT: ${{ github.event.pull_request.head.sha }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          expected_title="Docs sync $CTXD_COMMIT $REQUEST_ID"
          gh workflow run sync-docs.yml \
            --repo ctxd-dev/ctxd-landing \
            --ref main \
            -f ctxd_commit="$CTXD_COMMIT" \
            -f request_id="$REQUEST_ID" \
            -f validate_only=true

          run_id=""
          for attempt in {1..30}; do
            run_id=$(gh run list \
              --repo ctxd-dev/ctxd-landing \
              --workflow sync-docs.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 50 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"$expected_title\") | .databaseId" \
              | head -n 1)
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || {
            echo "Timed out locating ctxd-landing validation run: $expected_title" >&2
            exit 1
          }

          gh run watch "$run_id" --repo ctxd-dev/ctxd-landing --exit-status
          run_url=$(gh run view "$run_id" --repo ctxd-dev/ctxd-landing --json url --jq .url)
          echo "ctxd-landing validation: $run_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set Up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync --locked

      - name: Run Tests
        run: uv run pytest tests -v

      - name: Build Distributions
        run: uv build

      - name: Smoke Test Built Wheel
        run: |
          python -m venv "$RUNNER_TEMP/ctxd-wheel-smoke"
          "$RUNNER_TEMP/ctxd-wheel-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/ctxd-wheel-smoke/bin/ctxd" --version
          "$RUNNER_TEMP/ctxd-wheel-smoke/bin/python" -c \
            "import ctxd, ctxfs, ctxd.tracker, ctxd.local_ctxfs_service"

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctxd/
    permissions:
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set Up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync --locked

      - name: Build Distributions
        run: uv build

      - name: Check PyPI Version
        id: pypi_version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if curl -fs "https://pypi.org/pypi/ctxd/$VERSION/json" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Distributions to PyPI
        if: ${{ steps.pypi_version.outputs.exists == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
